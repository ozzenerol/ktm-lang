name: release

# Runs when you publish a release in the GitHub UI (or via `gh release
# create`). Each matrix leg builds ktm + libktm for one target and
# attaches ktm-<version>-<os>-<arch>.zip to that release.
#
# workflow_dispatch is kept for dry runs: it builds and tests every
# target and uploads the zips as workflow artifacts instead, so the
# pipeline can be exercised without cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than 24.04 to keep the glibc floor at
          # 2.35, so the binaries run on older distros too.
          - runner: ubuntu-22.04
            os_name: linux
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            os_name: linux
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
          - runner: macos-15
            os_name: macos
            arch: aarch64
            triple: aarch64-apple-darwin
          # macOS on Intel is not a supported target.

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential
          else
            command -v cmake >/dev/null || brew install cmake
          fi

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg=ktm-$version-${{ matrix.os_name }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # A native ktm is always needed: it is the compiler that has to
      # RUN to turn std/*.ktm into target assembly.
      - name: Build native ktm
        run: |
          make C_COMPILER=cc BUILD_TYPE=Release INSTALL_PREFIX=/usr/local
          cp ./ktm ./ktm-native

      # libktm and the modules' .ktmlib markers, exactly as build.sh
      # makes them: `ktm -lib ktm` over the module tree. Every runner is
      # native (the matrix has no cross leg), so the host's library naming
      # is the target's. Writing the markers by hand once missed nested
      # modules (net/http, net/url, encoding/*) and the `init` line of
      # modules with run-time initialisers (log, net.http).
      - name: Build libktm
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          stage="$PWD/$PKG"
          mkdir -p "$stage/lib" "$stage/modules"
          cp -R ./src/std/. "$stage/modules/"
          # net.tls, net.https and crypto stay source, outside libktm (see build.sh)
          rm -rf "$stage/modules/net/tls" "$stage/modules/net/https" "$stage/modules/crypto"
          "$GITHUB_WORKSPACE/ktm-native" -fPIC -lib ktm --install-dir="$stage" "$stage/modules"
          # every library module (the prelude is read whole by every
          # program, it has none) must have its marker: a missing one makes
          # importers compile the module again and fail to link
          missing=$(cd "$stage/modules" && for d in $(find . -name '*.ktm' -exec dirname {} \; | sort -u); do
                      [ "$d" = ./prelude ] || [ -f "$d/.ktmlib" ] || echo "$d"; done)
          [ -z "$missing" ] || { echo "no .ktmlib in: $missing"; exit 1; }

          # net.tls (source) and libktmtls (mbedTLS), which the cmake
          # build made: the archive, and the shared object by its
          # versioned name only, as for libktm
          cp -R ./src/std/net/tls "$stage/modules/net/tls"
          cp -R ./src/std/crypto "$stage/modules/crypto"
          cp -R ./src/std/net/https "$stage/modules/net/https"
          cp ./build/libktmtls.a "$stage/lib/libktmtls.a"
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            cp ./build/libktmtls.so "$stage/lib/libktmtls.so.0.0.1"
          else
            cp ./build/libktmtls.dylib "$stage/lib/libktmtls.0.0.1.dylib"
          fi

      - name: Stage package
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          cp ./ktm "./$PKG/ktm"
          cp ./packaging/install.sh "./$PKG/install.sh"
          cp -R ./src/syntax-highlighting/vim "./$PKG/vim"
          chmod +x "./$PKG/ktm" "./$PKG/install.sh"
          ls -la "./$PKG" "./$PKG/lib" "./$PKG/modules"
          file "./$PKG/ktm" "./$PKG/lib/"*

      # Installs into a scratch prefix and compiles + runs a program
      # through both the AOT and JIT paths. Catches the failure that
      # matters most here: a libktm laid out under a name the linker
      # or jitLoadLibtos does not probe for.
      - name: Smoke test
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          prefix="$PWD/smoke-prefix"
          "./$PKG/install.sh" --prefix="$prefix"
          printf 'i32 main() {\n    printf("hello %%d\\n", 40 + 2);\n    return 0;\n}\n' > ./hello.ktm
          "$prefix/bin/ktm" --install-dir="$prefix" ./hello.ktm -o ./hello
          test "$(./hello)" = "hello 42"
          test "$("$prefix/bin/ktm" --install-dir="$prefix" -jit ./hello.ktm)" = "hello 42"
          # nested modules and modules with run-time initialisers, from the
          # library (a missing .ktmlib compiled them again: duplicate symbols)
          cat > ./mods.ktm <<'KTM'
          import encoding.base64, log, net.http, net.url;
          void ok(http.Writer *w, http.Request *r) { w.text(200, "ok"); }
          i32 main() {
              http.Mux mux;
              mux.handle("GET /{$}", &ok);
              http.Request r = http.testRequest("GET", "/");
              http.Writer w = http.recorder();
              mux.serve(&w, &r);
              url.URL u;
              url.parse("https://example.com/x", &u);
              String b = base64.encode("hi");
              printf("%d %s %s\n", w.code, u.host, b);
              log.info("logged");
              return 0;
          }
          KTM
          "$prefix/bin/ktm" --install-dir="$prefix" ./mods.ktm -o ./mods
          test "$(./mods)" = "200 example.com aGk="
          test "$("$prefix/bin/ktm" --install-dir="$prefix" -jit ./mods.ktm)" = "200 example.com aGk="

      - name: Create zip
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: zip -r "$PKG.zip" "$PKG"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.version.outputs.pkg }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$PKG.zip" --clobber

      - name: Upload artifact (dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.pkg }}
          path: ${{ steps.version.outputs.pkg }}.zip
