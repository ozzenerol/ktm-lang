name: release

# Runs when you publish a release in the GitHub UI (or via `gh release
# create`). Each matrix leg builds ktm + libktm for one target and
# attaches ktm-<version>-<os>-<arch>.zip to that release.
#
# workflow_dispatch is kept for dry runs: it builds and tests every
# target and uploads the zips as workflow artifacts instead, so the
# pipeline can be exercised without cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than 24.04 to keep the glibc floor at
          # 2.35, so the binaries run on older distros too.
          - runner: ubuntu-22.04
            os_name: linux
            arch: x86_64
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            os_name: linux
            arch: aarch64
            triple: aarch64-unknown-linux-gnu
          - runner: macos-15
            os_name: macos
            arch: aarch64
            triple: aarch64-apple-darwin
          # macOS on Intel is not a supported target.

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake build-essential
          else
            command -v cmake >/dev/null || brew install cmake
          fi

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg=ktm-$version-${{ matrix.os_name }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      # A native ktm is always needed: it is the compiler that has to
      # RUN to turn std/*.ktm into target assembly.
      - name: Build native ktm
        run: |
          make C_COMPILER=cc BUILD_TYPE=Release INSTALL_PREFIX=/usr/local
          cp ./ktm ./ktm-native

      # Deliberately NOT `ktm -lib ktm`: ktmLibInit picks the library
      # naming and link commands from a build-time `#if IS_BSD` /
      # `#elif IS_LINUX`, i.e. from the host rather than from
      # cc->target, so it cannot produce a cross-target library. These
      # explicit steps are what ktmLibInit runs, with the target chosen
      # from the triple.
      - name: Build libktm
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          stage="$PWD/$PKG"
          mkdir -p "$stage/lib" "$stage/modules"

          # The standard library's modules (prelude and rt among them),
          # compiled as one tree: what `ktm -lib ktm <prefix>/modules`
          # does, through -S so the target is the triple's.
          cp -R ./src/std/. "$stage/modules/"
          # net.tls stays source, outside libktm (see build.sh)
          rm -rf "$stage/modules/net/tls"
          "$GITHUB_WORKSPACE/ktm-native" \
            --target=${{ matrix.triple }} \
            --install-dir="$stage" \
            -fPIC -S -o "$GITHUB_WORKSPACE/ktm.s" -lib ktm "$stage/modules"

          cc -fPIC -c ./ktm.s -o ./ktm.o

          # One -fPIC object feeds both the archive and the shared
          # library, exactly as the source build does.
          ar rcs "$stage/lib/libktm.a" ./ktm.o

          if [ "${{ matrix.os_name }}" = "linux" ]; then
            shlib=libktm.so.0.0.1
            # -Bsymbolic binds libktm's internal global references
            # (e.g. the `Fs` exception object) to its own definitions,
            # which is what lets codegen use direct RIP-relative /
            # adrp+add addressing instead of the GOT.
            cc -fPIC -shared -Wl,-Bsymbolic -Wl,-soname,libktm.so.0.0.1 \
              ./ktm.o -o "$stage/lib/libktm.so.0.0.1" -lpthread -lc -lm
          else
            shlib=libktm.0.0.1.dylib
            cc -dynamiclib \
              -install_name @rpath/libktm.0.0.1.dylib \
              ./ktm.o -o "$stage/lib/libktm.0.0.1.dylib" -lpthread -lc -lm
          fi

          # Each module's .ktmlib marker, as `ktm -lib` writes them: an
          # importer links the library instead of compiling the module
          for d in "$stage"/modules/*/; do
            printf 'static ../../lib/libktm.a\nshared ../../lib/%s\n' "$shlib" > "$d/.ktmlib"
          done

          # net.tls (source) and libktmtls (mbedTLS), which the cmake
          # build made: the archive, and the shared object by its
          # versioned name only, as for libktm
          cp -R ./src/std/net/tls "$stage/modules/net/tls"
          cp ./build/libktmtls.a "$stage/lib/libktmtls.a"
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            cp ./build/libktmtls.so "$stage/lib/libktmtls.so.0.0.1"
          else
            cp ./build/libktmtls.dylib "$stage/lib/libktmtls.0.0.1.dylib"
          fi

      - name: Stage package
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          cp ./ktm "./$PKG/ktm"
          cp ./packaging/install.sh "./$PKG/install.sh"
          cp -R ./src/syntax-highlighting/vim "./$PKG/vim"
          chmod +x "./$PKG/ktm" "./$PKG/install.sh"
          ls -la "./$PKG" "./$PKG/lib" "./$PKG/modules"
          file "./$PKG/ktm" "./$PKG/lib/"*

      # Installs into a scratch prefix and compiles + runs a program
      # through both the AOT and JIT paths. Catches the failure that
      # matters most here: a libktm laid out under a name the linker
      # or jitLoadLibtos does not probe for.
      - name: Smoke test
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: |
          set -eux
          prefix="$PWD/smoke-prefix"
          "./$PKG/install.sh" --prefix="$prefix"
          printf 'i32 main() {\n    printf("hello %%d\\n", 40 + 2);\n    return 0;\n}\n' > ./hello.ktm
          "$prefix/bin/ktm" --install-dir="$prefix" ./hello.ktm -o ./hello
          test "$(./hello)" = "hello 42"
          test "$("$prefix/bin/ktm" --install-dir="$prefix" -jit ./hello.ktm)" = "hello 42"

      - name: Create zip
        env:
          PKG: ${{ steps.version.outputs.pkg }}
        run: zip -r "$PKG.zip" "$PKG"

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.version.outputs.pkg }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$PKG.zip" --clobber

      - name: Upload artifact (dry run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.pkg }}
          path: ${{ steps.version.outputs.pkg }}.zip
